services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expenses
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - expense-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expenses"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: expense-sharing-app:local
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://expense:expense@db:5432/expenses
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    image: expense-sharing-app:local
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://expense:expense@db:5432/expenses
      EXACT_SETTLEMENT_THRESHOLD: ${EXACT_SETTLEMENT_THRESHOLD:-16}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expenses_test
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expenses_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  expense-data:
