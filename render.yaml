# Single-instance free recruiter demo. See docs/render.md for limits and review steps.
services:
  - type: web
    name: expense-sharing-app
    runtime: docker
    repo: https://github.com/manansethi1205/expense-sharing-app
    branch: main
    plan: free
    region: singapore
    dockerCommand: python -m scripts.start_render
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-sharing-db
          property: connectionString
      - key: EXACT_SETTLEMENT_THRESHOLD
        value: "16"
databases:
  - name: expense-sharing-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: expenses
    user: expense
    ipAllowList: []
